[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[project]
name = "graph_rl"
version = "1.0.0"
description = "Constrained Goal-directed Planar Graph Generation with Grammar-based Reinforcement Learning"
readme = "README.md"
keywords = [
    "Graph Generation, Reinforcement Learning, Grammars",
]
classifiers = [
    "Natural Language :: English",
    "Programming Language :: Python :: 3.10",
]
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Nicolas Hochuli", email = "nhochuli@ethz.ch" },
    { name = "Lorenzo Miele", email = "lmiele@ethz.ch" },
]

dependencies = [
    # Core / ML
    "torch",                   # Installed from the PyTorch CUDA 13 index (see [tool.uv] below)
    "jax==0.6.2; sys_platform != 'linux'",
    "jax[cuda12]==0.6.2; sys_platform == 'linux'",  # Keep JAX core/jaxlib/CUDA plugin on the same ABI
    "optax",
    "flax",
    "scikit-learn",
    "torch_geometric",
    # Logging / utils / numerics
    "tensorboard",
    "networkx",
    "coloredlogs",
    "numpy<2",  # graph-tool requires NumPy 1.x
    "matplotlib",
    "mapbox-earcut",
    "hydra-core>=1.3",
    "scikit-learn",
    # RL / envs
    "gymnasium>=0.29",
    # Git dependency
    "logging_mod @ git+https://github.com/nicolas-git/logging_mod.git",
    "torchinfo>=1.8.0",
    "evosax>=0.2.0",
    # Local dependency
    "ipykernel",
    "jupyter-core",
    # prodigy dependencies
    "easydict",
    "pyemd",
    "dill",
    "pandas",
    "rdkit",
    "scipy",
    "tqdm",
    "pyyaml",
    "wandb",
    "pytorch_lightning",
    "DiGress",
    "overrides",
    # GraphScoreMatching dependencies
    "imageio",
    "requests",
    "msgpack",
    "fcd-torch",
    "setuptools>=68,<81",
    "cycler",
    "decorator",
    "kiwisolver",
    "nose",
    "pyparsing",
    "python-dateutil",
    "six",
    "termcolor",
    # SPECTRE dependencies
    "torch-householder",
    "pygsp",
    "torch-ema",
    "boltzmann-planar-graph",
    "alphashape>=1.3.1",
]

# ------------ uv-specific config -------------
[tool.uv]
# Install development tools (including Ruff and pytest) by default
default-groups = ["dev"]

[tool.uv.sources]
# Only pull CUDA wheels for torch when running on Linux
torch = [
    { index = "torch-cpu", marker = "platform_system == 'Darwin'"},
    { index = "torch-gpu", marker = "platform_system == 'Linux'"},
]
DiGress = { path = "ext/DiGress/DiGress", editable = true }
boltzmann-planar-graph = { path = "ext/boltzmann-planar-graph", editable = true }

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "torch-gpu"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 120
extend-exclude = ["ext", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
