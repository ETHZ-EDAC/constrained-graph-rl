data:
  data: hog_planar_lt100
  dir: './data'
  batch_size: 128
  test_split: 0.2
  max_node_num: 250
  max_feat_num: 19
  init: zeros
  adj_vals: [0, 1]
  feat_vals: []

ckpt: Mar26-22:04:21_800

sde:
  x:
    type: VP
    beta_min: 0.1
    beta_max: 1.0
    num_scales: 1000
  adj:
    type: VP
    beta_min: 0.1
    beta_max: 1.0
    num_scales: 1000

sampler:
  predictor: Euler
  corrector: Langevin
  snr: 0.1
  scale_eps: 0.7
  n_steps: 1 #corrector steps

sample:
  use_ema: False
  noise_removal: True
  probability_flow: False
  eps: 1.0e-4
  seed: 11
