# @package _global_
general:
    name: 'hog_planar_unconditional'
    gpus: 1
    wandb: 'online'
    resume: null
    test_only: null
    check_val_every_n_epochs: 10
    sample_every_val: 3
    samples_to_generate: 32
    samples_to_save: 9
    chains_to_save: 1
    final_model_samples_to_generate: 100
    final_model_samples_to_save: 30
    final_model_chains_to_save: 20

train:
    n_epochs: 1000
    batch_size: 8
    save_model: True
    lr: 0.0002
    clip_grad: 1.0
    num_workers: 2
    ema_decay: 0
    weight_decay: 1e-12
    optimizer: adamw

model:
    type: 'discrete'
    n_layers: 5
    hidden_mlp_dims: {'X': 256, 'E': 128, 'y': 128}
    hidden_dims: {'dx': 256, 'de': 64, 'dy': 64, 'n_head': 8, 'dim_ffX': 256, 'dim_ffE': 128, 'dim_ffy': 128}
    lambda_train: [5, 0]
    extra_features: null
    transition: 'marginal'
    diffusion_noise_schedule: 'cosine'
    diffusion_steps: 500

dataset:
    name: 'hog_planar'
    remove_h: null
